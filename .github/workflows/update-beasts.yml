name: Update beast prices

on:
  schedule:
    # A cada 4 horas — mesma cadência que a poe-vendor-string usa
    - cron: "0 */4 * * *"
  workflow_dispatch: {}   # permite rodar manualmente pela aba Actions
  push:
    branches: [main]      # roda também a cada push, pra facilitar teste

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch beast prices from poe.ninja
        # Troque LEAGUE pelo nome exato da liga atual (ex: "Standard",
        # "Hardcore", ou o nome da liga temporária em vigor)
        run: node scripts/fetch-beasts.mjs "${{ vars.LEAGUE || 'Standard' }}"

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- docs/data/beasts.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated data
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/beasts.json
          git commit -m "chore: atualiza preços de bestas ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push

  deploy-pages:
    needs: update-data
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
